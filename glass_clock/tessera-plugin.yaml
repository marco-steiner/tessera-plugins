# Glass clock: a screensaver of its own (plugin API 0.14 and later, docs/FIRMWARE_API.md "A screensaver"). The time in
# tall, thin digits of frosted glass over a picture from an image entity of Home Assistant, the way the iPhone's lock
# screen shows it. The digits are drawn from rounded strokes (arcs and bars) with a clear body and a bright rim, since
# a plugin has no font of its own. docs/MANIFEST.md has every field.
#
# Two ways to draw them, an option: "raster" draws each digit as one soft picture in the ink's colour (A8, in PSRAM), "strokes"
# builds it from LVGL arcs and bars.
id: glass_clock
version: 0.3.0
api: "0.17"
icon: clock-outline
maintainer: glass-clock-author
license: MIT
stage: beta
topics: [time, photos]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 8

# The overlay picture is fetched from the person's own Home Assistant domain (its www folder, served under /local/).
# Replace the host with your domain (no address, no port, nothing on the home network), and the privacy link with a page
# that says what the host sees (the README's Privacy section is fine).
permissions:
  network: [smarthomebude.eu]
attributes: [cloud]
privacy: https://github.com/marco-steiner/tessera-plugins/tree/main/glass_clock#privacy

savers:
  # A step of its own: the person picks an image entity (or a camera) for it in the Screensaver card, and puts the step
  # first in the order to have it show before the other steps. It always has something to show once an entity is chosen.
  - id: glass
    name: saver_name
    icon: clock-outline
    step: own
    # About 60 LVGL objects: four digits of up to thirteen parts each (an arc has five layers: body, two edges, two caps), the colon, the shade, the
    # picture's place and the date. The arcs are heavier than a label.
    memory: 14000
    # Two places: the picture of the chosen entity under everything, and the overlay over the clock (from the host in permissions.network).
    pictures: 2
    domains: [image, camera]
    when: always
    example: saver_example
    options:
      - id: layout
        kind: choice
        label: layout
        hint: layout_hint
        default: auto
        choices:
          - { value: auto, label: layout_auto }
          - { value: side, label: layout_side }
          - { value: stacked, label: layout_stacked }
      - id: mode
        kind: choice
        label: mode
        hint: mode_hint
        default: raster
        choices:
          - { value: raster, label: mode_raster }
          - { value: strokes, label: mode_strokes }
      - id: detail
        kind: choice
        label: detail
        hint: detail_hint
        default: light
        choices:
          - { value: light, label: detail_light }
          - { value: full, label: detail_full }
          - { value: minimal, label: detail_minimal }
      - { id: dim, kind: number, min: 0, max: 80, step: 5, unit: "%", default: 35, label: dim, hint: dim_hint }
      - { id: offset, kind: number, min: -100, max: 100, step: 5, unit: "%", default: 0, label: offset, hint: offset_hint }
      - { id: overlay_url, kind: text, default: "", label: overlay_url, hint: overlay_url_hint }
      - { id: overlay_opa, kind: number, min: 10, max: 100, step: 5, unit: "%", default: 100, label: overlay_opa, hint: overlay_opa_hint }
      - id: overlay_layer
        kind: choice
        label: overlay_layer
        hint: overlay_layer_hint
        default: cut
        choices:
          - { value: cut, label: overlay_cut }
          - { value: behind, label: overlay_behind }
          - { value: front, label: overlay_front }
      - { id: date, kind: toggle, default: true, label: date, hint: date_hint }
      - { id: seconds, kind: toggle, default: true, label: seconds, hint: seconds_hint }
