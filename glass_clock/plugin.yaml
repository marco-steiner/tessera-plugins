# What a screen gets when it takes this plugin: the component, configured. Tessera includes this file from the screen's
# <name>.plugins.yaml and adds this plugin's components/ folder as an ESPHome external component.
glass_clock:
  # The overlay PNG the clock is cut out by. While the firmware is built, the plugin makes the silhouette from its alpha
  # channel by itself (no overlay_mask.h, no extra tool). Use the same picture as the option "Overlay address" in the app.
  # A web address (the build needs to reach it) or a file name (in the screen's config folder or in components/glass_clock/).
  # Without this line nothing is cut out.
  overlay_image: https://smarthomebude.eu/local/tessera/clock-overlay-1a.png
  #
  # Optional (defaults shown):
  glass_width: 480    # the glass the picture is fitted to, in pixels (480 x 480 for the Guition 4)
  glass_height: 480
  mask_width: 240     # silhouette resolution: 240 x 240 = 56 KB of flash; 160 is smaller, 320 more exact
  mask_grow: 0        # cut the digits out this many pixels wider than the picture
